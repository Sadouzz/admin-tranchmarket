<div class="min-h-screen bg-[#edf0f7] text-slate-800 flex flex-col font-sans selection:bg-indigo-500 selection:text-white relative overflow-x-hidden">
  
  <!-- Ambient Luminous Background Mesh Orbs -->
  <div class="fixed top-0 left-1/4 w-[600px] h-[600px] bg-purple-300/30 rounded-full blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-10 right-1/4 w-[550px] h-[550px] bg-sky-200/40 rounded-full blur-[130px] pointer-events-none -z-10"></div>
  <div class="fixed top-1/3 right-10 w-[450px] h-[450px] bg-pink-200/30 rounded-full blur-[110px] pointer-events-none -z-10"></div>

  <!-- Top VisionOS / macOS Frosted Header -->
  <header class="sticky top-3 z-40 px-4 sm:px-6 lg:px-8 max-w-[1600px] w-full mx-auto">
    <div class="bg-white/85 backdrop-blur-2xl border border-white/80 rounded-full h-14 px-4 sm:px-6 shadow-xl shadow-slate-200/50 flex items-center justify-between gap-4">
      
      <!-- Left: Window controls & Logo -->
      <div class="flex items-center gap-4 shrink-0">
        <!-- macOS dots -->
        <div class="hidden sm:flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-full bg-[#ff5f56] shadow-2xs"></span>
          <span class="w-3 h-3 rounded-full bg-[#ffbd2e] shadow-2xs"></span>
          <span class="w-3 h-3 rounded-full bg-[#27c93f] shadow-2xs"></span>
        </div>

        <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>

        <!-- Brand / AI Sparkle Logo -->
        <a routerLink="/dashboard" class="flex items-center gap-2 text-slate-900 font-extrabold tracking-tight text-sm hover:opacity-85 transition-opacity">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-violet-600 via-indigo-600 to-sky-400 flex items-center justify-center text-white shadow-sm shadow-indigo-500/30 text-xs">
            ✦
          </div>
          <span class="font-extrabold text-sm tracking-tight text-slate-900">TranchMarket <span class="text-indigo-600 font-semibold text-xs">AI</span></span>
        </a>
      </div>

      <!-- Center: VisionOS Pill Navigation Tabs -->
      <nav class="hidden lg:flex items-center gap-1 bg-slate-100/80 p-1 rounded-full border border-slate-200/60 shadow-2xs text-xs font-semibold text-slate-600">
        <a
          routerLink="/dashboard"
          routerLinkActive="!bg-[#38bdf8] !text-white shadow-md shadow-sky-400/40 font-bold"
          class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-slate-900"
        >
          Overview
        </a>
        <a
          routerLink="/products"
          routerLinkActive="!bg-[#38bdf8] !text-white shadow-md shadow-sky-400/40 font-bold"
          class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-slate-900"
        >
          Produits
        </a>
        <a
          routerLink="/brands"
          routerLinkActive="!bg-[#38bdf8] !text-white shadow-md shadow-sky-400/40 font-bold"
          class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-slate-900"
        >
          Marques
        </a>
        <a
          routerLink="/orders"
          routerLinkActive="!bg-[#38bdf8] !text-white shadow-md shadow-sky-400/40 font-bold"
          class="px-3.5 py-1.5 rounded-full transition-all duration-200 hover:text-slate-900"
        >
          Commandes
        </a>
      </nav>

      <!-- Right: Search, Notifications, Avatars & Action Button -->
      <div class="flex items-center gap-2 sm:gap-3 shrink-0">
        
        <!-- Search icon button -->
        <button class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors cursor-pointer text-xs" title="Recherche">
          🔍
        </button>

        <!-- Notifications button -->
        <button class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center transition-colors cursor-pointer text-xs relative" title="Notifications">
          🔔
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
        </button>

        <!-- Team Avatar Stack + Share Action Button -->
        <div class="flex items-center bg-gradient-to-r from-sky-400 via-sky-500 to-blue-600 text-white rounded-full p-1 pr-3.5 pl-1 shadow-md shadow-sky-500/25 gap-2 cursor-pointer hover:shadow-lg hover:shadow-sky-500/35 transition-all">
          <div class="flex -space-x-2 overflow-hidden items-center">
            <img class="inline-block h-6 w-6 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&q=80" alt="User 1" />
            <img class="inline-block h-6 w-6 rounded-full ring-2 ring-white object-cover" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&q=80" alt="User 2" />
          </div>
          <span class="text-xs font-bold tracking-tight flex items-center gap-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
              <polyline points="16 6 12 2 8 6"/>
              <line x1="12" y1="2" x2="12" y2="15"/>
            </svg>
            Partager
          </span>
        </div>

        <!-- Logout button -->
        <button
          (click)="logout()"
          class="w-8 h-8 rounded-full bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 flex items-center justify-center transition-colors cursor-pointer text-xs ml-1"
          title="Déconnexion">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

      </div>

    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <router-outlet></router-outlet>
  </main>

</div>
